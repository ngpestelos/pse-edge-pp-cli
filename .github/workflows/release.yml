name: Release

# Builds prebuilt binaries for every target in CI and attaches them to the
# GitHub release on tag push — so no fleet machine compiles modernc.org/sqlite.
# Assets are signed keylessly with cosign (sigstore) bound to THIS workflow's
# GitHub Actions OIDC identity at refs/tags/v*; see README "Install integrity".
# Note: a workflow_dispatch (manual) release runs at refs/heads/<branch>, so its
# signatures do NOT match the tag identity install.sh verifies — such releases
# fall back to checksum-only verification.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # id-token grants the OIDC identity used for keyless cosign signing.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      # Pinned to the v3.9.2 commit SHA: this action is the trust-critical
      # step for keyless signing, so it must not float with a mutable tag.
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Self-check: verify a freshly produced signature with the EXACT same
      # constraints install.sh uses, so a typo or identity drift fails the
      # release instead of silently shipping unverifiable assets.
      - name: Verify checksums signature (install.sh contract)
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt \
            --certificate-identity-regexp 'https://github.com/ph-commons/pse-edge-pp-cli/.github/workflows/release.yml@refs/tags/v[0-9]+(\.[0-9]+)*.*' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
