version: 2
project_name: pse-edge-pp-cli
changelog:
  disable: true
builds:
  - id: pse-edge-pp-cli
    main: ./cmd/pse-edge-pp-cli
    binary: pse-edge-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/ph-commons/pse-edge-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: pse-edge-pp-mcp
    main: ./cmd/pse-edge-pp-mcp
    binary: pse-edge-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/ph-commons/pse-edge-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt

# SBOMs (provenance artifacts) generated per archive via syft (provisioned
# by goreleaser). Uses the goreleaser v2 default args so a real file is
# produced: spdx-json=$document -> {{ .ArtifactName }}.sbom.json.
sboms:
  - artifacts: archive
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"
      - "--enrich"
      - "all"

# Keyless cosign signing (sigstore, GitHub Actions OIDC). cosign v3 bundle
# form: each artifact produces <artifact>.sigstore.json. The signature file
# is declared via `signature:` so goreleaser tracks and uploads it.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

  - id: archives
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: archive
    output: true

  - id: sboms
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: sbom
    output: true
